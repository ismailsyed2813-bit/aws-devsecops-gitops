apiVersion: apps/v1
kind: Deployment
metadata:
  name: devsecops-gitops-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devsecops-gitops-app
  template:
    metadata:
      labels:
        app: devsecops-gitops-app
    spec:
      containers:
        - name: devsecops-gitops-app
          image: 119623945333.dkr.ecr.ap-south-2.amazonaws.com/devsecops-gitops-app:1.0
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20